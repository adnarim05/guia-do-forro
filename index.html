<title>Guia do Forró</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<style>
/* Layout: revista de estudo. Capas editoriais por destino, a cor do colar comanda a página do nível.
   Celular: barra inferior. Tablet (600–1199): trilho lateral. Computador (1200+): menu lateral e lista + detalhe. */
:root{
  --primary:#156E0D;--on-primary:#FFFFFF;--primary-container:#A6F690;--on-primary-container:#0D2000;
  --secondary:#506449;--on-secondary:#FFFFFF;--secondary-container:#D3E9CA;--on-secondary-container:#0F2005;
  --tertiary:#2959BC;--on-tertiary:#FFFFFF;--tertiary-container:#DEE0FF;--on-tertiary-container:#001944;
  --error:#B4271F;--on-error:#FFFFFF;--error-container:#FFDAD3;--on-error-container:#380C00;
  --surface:#F5FBF2;--on-surface:#181D17;--surface-variant:#DAE6D5;--on-surface-variant:#3F4A3C;
  --sc-lowest:#FFFFFF;--sc-low:#EFF5ED;--sc:#E9F0E7;--sc-high:#E4EAE1;--sc-highest:#DEE4DC;
  --outline:#6F7A6B;--outline-variant:#BECAB9;--inverse-surface:#2D322B;--inverse-on-surface:#ECF3EA;--inverse-primary:#8ADA75;
  --scrim:rgba(0,0,0,.4);--shadow:rgba(0,0,0,.18);
  --brand-green:#3DEB3D;--on-brand:#0D2000;
  --c-transparente:#DFF4FF;--on-c-transparente:#20333C;--cc-transparente:#DFF4FF;--on-cc-transparente:#20333C;
  --c-branca:#FFFFFF;--on-c-branca:#1B1B1B;--cc-branca:#F1F1F1;--on-cc-branca:#1B1B1B;
  --c-azul:#006688;--on-c-azul:#FFFFFF;--cc-azul:#C2E8FF;--on-cc-azul:#001E2B;
  --c-preta:#1B1B1B;--on-c-preta:#FFFFFF;--cc-preta:#E2E2E2;--on-cc-preta:#1B1B1B;
  --c-vermelha:#C0001B;--on-c-vermelha:#FFFFFF;--cc-vermelha:#FFDAD4;--on-cc-vermelha:#3B0900;
  --hatch:rgba(23,29,23,.06);
  --font-display:'Lato','Helvetica Neue',Arial,sans-serif;
  --font-body:'Roboto','Helvetica Neue',Arial,sans-serif;
  --r-xs:4px;--r-s:8px;--r-m:12px;--r-l:16px;--r-xl:28px;--r-full:999px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#8ADA75;--on-primary:#063900;--primary-container:#005300;--on-primary-container:#A6F690;
  --secondary:#B7CDAF;--on-secondary:#23351E;--secondary-container:#394C33;--on-secondary-container:#D3E9CA;
  --tertiary:#BCC2FF;--on-tertiary:#002D6D;--tertiary-container:#004299;--on-tertiary-container:#DEE0FF;
  --error:#FFB4A5;--on-error:#690000;--error-container:#93000B;--on-error-container:#FFDAD3;
  --surface:#10150D;--on-surface:#DEE4DC;--surface-variant:#3F4A3C;--on-surface-variant:#BECAB9;
  --sc-lowest:#091006;--sc-low:#181D17;--sc:#1C211B;--sc-high:#272B25;--sc-highest:#31362F;
  --outline:#899484;--outline-variant:#3F4A3C;--inverse-surface:#DEE4DC;--inverse-on-surface:#2D322B;--inverse-primary:#156E0D;
  --scrim:rgba(0,0,0,.6);--shadow:rgba(0,0,0,.5);
  --brand-green:#3DEB3D;--on-brand:#0D2000;
  --c-transparente:#364953;--on-c-transparente:#D0E6F1;--cc-transparente:#20333C;--on-cc-transparente:#D0E6F1;
  --c-branca:#FFFFFF;--on-c-branca:#1B1B1B;--cc-branca:#303030;--on-cc-branca:#E2E2E2;
  --c-azul:#76D1FF;--on-c-azul:#003548;--cc-azul:#003548;--on-cc-azul:#C2E8FF;
  --c-preta:#1B1B1B;--on-c-preta:#FFFFFF;--cc-preta:#2A2A2A;--on-cc-preta:#E2E2E2;
  --c-vermelha:#FFB4A8;--on-c-vermelha:#690007;--cc-vermelha:#5C0002;--on-cc-vermelha:#FFDAD4;
  --hatch:rgba(222,228,220,.06);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --primary:#8ADA75;--on-primary:#063900;--primary-container:#005300;--on-primary-container:#A6F690;
  --secondary:#B7CDAF;--on-secondary:#23351E;--secondary-container:#394C33;--on-secondary-container:#D3E9CA;
  --tertiary:#BCC2FF;--on-tertiary:#002D6D;--tertiary-container:#004299;--on-tertiary-container:#DEE0FF;
  --error:#FFB4A5;--on-error:#690000;--error-container:#93000B;--on-error-container:#FFDAD3;
  --surface:#10150D;--on-surface:#DEE4DC;--surface-variant:#3F4A3C;--on-surface-variant:#BECAB9;
  --sc-lowest:#091006;--sc-low:#181D17;--sc:#1C211B;--sc-high:#272B25;--sc-highest:#31362F;
  --outline:#899484;--outline-variant:#3F4A3C;--inverse-surface:#DEE4DC;--inverse-on-surface:#2D322B;--inverse-primary:#156E0D;
  --scrim:rgba(0,0,0,.6);--shadow:rgba(0,0,0,.5);
  --brand-green:#3DEB3D;--on-brand:#0D2000;
  --c-transparente:#364953;--on-c-transparente:#D0E6F1;--cc-transparente:#20333C;--on-cc-transparente:#D0E6F1;
  --c-branca:#FFFFFF;--on-c-branca:#1B1B1B;--cc-branca:#303030;--on-cc-branca:#E2E2E2;
  --c-azul:#76D1FF;--on-c-azul:#003548;--cc-azul:#003548;--on-cc-azul:#C2E8FF;
  --c-preta:#1B1B1B;--on-c-preta:#FFFFFF;--cc-preta:#2A2A2A;--on-cc-preta:#E2E2E2;
  --c-vermelha:#FFB4A8;--on-c-vermelha:#690007;--cc-vermelha:#5C0002;--on-cc-vermelha:#FFDAD4;
  --hatch:rgba(222,228,220,.06);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--on-surface);font:400 15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tertiary);outline-offset:2px;border-radius:6px}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';width:1em;overflow:hidden;flex:none}
.ms.fill{font-variation-settings:'FILL' 1}
.ms.sm{font-size:18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- tipografia ---------- */
.display{font:900 clamp(40px,8vw,84px)/.95 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.h1{font:900 clamp(32px,5vw,52px)/1.02 var(--font-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.h2{font:700 clamp(22px,3vw,28px)/1.15 var(--font-display);margin:0;text-wrap:balance}
.h3{font:700 19px/1.25 var(--font-display);margin:0}
.title{font:500 16px/1.4 var(--font-body);margin:0}
.body-l{font-size:17px;line-height:1.6}
.small{font-size:13px;line-height:1.45}
.muted{color:var(--on-surface-variant)}
.eyebrow{font:700 12px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface-variant);margin:0}
.num{font:900 15px/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.measure{max-width:64ch}

/* ---------- casca ---------- */
.shell{min-height:100%}
main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.page{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 32px;display:flex;flex-direction:column;gap:28px}
.page.narrow{max-width:760px}
.nav{position:fixed;z-index:40;background:var(--sc);display:flex}
.nav-list{display:flex;list-style:none;margin:0;padding:0}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--on-surface-variant);font:500 12px/1.2 var(--font-body);min-width:64px;padding-block:12px 16px;flex:1}
.nav-ind{display:grid;place-items:center;width:64px;height:32px;border-radius:var(--r-full);transition:background .2s}
.nav-item[aria-current="page"]{color:var(--on-surface)}
.nav-item[aria-current="page"] .nav-ind{background:var(--secondary-container);color:var(--on-secondary-container)}
.nav-item[aria-current="page"] .ms{font-variation-settings:'FILL' 1}
.nav-item:hover .nav-ind{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.nav-item[aria-current="page"]:hover .nav-ind{background:var(--secondary-container)}
.nav-brand,.nav-extra,.nav-foot{display:none}
@media (max-width:599px){
  .nav{left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));border-top:1px solid var(--outline-variant)}
  .nav-list{width:100%;justify-content:space-around}
}
@media (min-width:600px){
  main{padding-bottom:32px}
  .nav{top:0;bottom:0;left:0;flex-direction:column;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-left:env(safe-area-inset-left,0px);border-right:1px solid var(--outline-variant)}
}
@media (min-width:600px) and (max-width:1199px){
  .nav{width:calc(88px + env(safe-area-inset-left,0px));align-items:center}
  .nav-list{flex-direction:column;gap:8px;margin-top:24px}
  .nav-item{padding-block:4px}
  main{margin-left:calc(88px + env(safe-area-inset-left,0px))}
  .nav-brand.rail{display:grid}
}
@media (min-width:1200px){
  .nav{width:calc(280px + env(safe-area-inset-left,0px));padding-inline:12px;overflow-y:auto}
  main{margin-left:calc(280px + env(safe-area-inset-left,0px))}
  .nav-brand.drawer{display:flex}
  .nav-list{flex-direction:column;gap:2px}
  .nav-item{flex-direction:row;gap:12px;font-size:14px;padding:0 16px 0 0;min-height:56px;border-radius:var(--r-full)}
  .nav-item .nav-ind{width:auto;height:auto;padding-left:16px;background:none!important}
  .nav-item[aria-current="page"]{background:var(--secondary-container);color:var(--on-secondary-container)}
  .nav-item:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
  .nav-item[aria-current="page"]:hover{background:var(--secondary-container)}
  .nav-extra{display:block;margin-top:16px;border-top:1px solid var(--outline-variant);padding-top:12px}
  .nav-foot{display:flex;margin-top:auto;padding:16px 4px calc(16px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:12px}
  .mobile-only{display:none!important}
}
@media (max-width:1199px){.wide-only{display:none!important}}
.nav-brand{align-items:center;gap:12px;padding:8px 16px 16px}
.nav-brand.rail{place-items:center;width:56px;height:56px;border-radius:var(--r-l);background:var(--brand-green);color:var(--on-brand);font:900 18px/1 var(--font-display)}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--brand-green);color:var(--on-brand);display:grid;place-items:center;font:900 17px/1 var(--font-display);flex:none}
.brand-name{font:900 18px/1.1 var(--font-display)}
.nav-extra .nav-item{min-height:48px;font-size:14px;color:var(--on-surface-variant)}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);display:flex;align-items:center;gap:4px;min-height:64px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.topbar.scrolled{background:var(--sc)}
.topbar .t{font:500 20px/1.2 var(--font-display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-inner{max-width:1120px;margin-inline:auto;width:100%;display:flex;align-items:center;gap:4px}
.icon-btn{width:48px;height:48px;border-radius:var(--r-full);border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--on-surface-variant);flex:none;text-decoration:none}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.icon-btn.on{color:var(--on-surface)}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-m)}
.banner.offline{background:var(--inverse-surface);color:var(--inverse-on-surface)}
.banner.info{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.banner.warn{background:var(--error-container);color:var(--on-error-container)}
.banner.pend{background:color-mix(in srgb,#E8A302 22%,var(--sc-low));color:var(--on-surface);border:1px solid color-mix(in srgb,#E8A302 60%,var(--outline-variant))}
.offline-strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:35;background:var(--inverse-surface);color:var(--inverse-on-surface);font-size:13px;display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 16px;text-align:center}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 24px;border-radius:var(--r-full);border:1px solid transparent;font:500 14px/1 var(--font-body);letter-spacing:.01em;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,box-shadow .15s}
.btn .ms{font-size:18px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.filled:hover{box-shadow:0 1px 3px var(--shadow)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{border-color:var(--outline);background:none;color:var(--primary)}
.btn.text{background:none;color:var(--primary);padding:0 12px}
.btn.danger{background:var(--error);color:var(--on-error)}
.btn.lg{min-height:56px;padding:0 28px;font-size:16px}
.btn:hover:not(.filled):not(:disabled){background-image:linear-gradient(color-mix(in srgb,currentColor 8%,transparent),color-mix(in srgb,currentColor 8%,transparent))}
.btn:disabled,.btn[aria-disabled="true"]{background:color-mix(in srgb,var(--on-surface) 12%,transparent)!important;color:color-mix(in srgb,var(--on-surface) 38%,transparent)!important;border-color:transparent!important;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:35;display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 20px;border-radius:var(--r-l);background:var(--primary-container);color:var(--on-primary-container);border:0;box-shadow:0 3px 8px var(--shadow);font:500 15px/1 var(--font-body);text-decoration:none;cursor:pointer}
@media (min-width:600px){.fab{bottom:calc(24px + env(safe-area-inset-bottom,0px))}}

/* chips e selos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--outline-variant);background:none;color:var(--on-surface-variant);font:500 14px/1 var(--font-body);cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent;padding-left:8px}
.chip .ms{font-size:18px}
.selo{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:var(--r-s);font:500 13px/1 var(--font-body);border:1px solid var(--outline);white-space:nowrap}
.selo.transparente{background:var(--c-transparente);color:var(--on-c-transparente)}
.selo.branca{background:var(--c-branca);color:var(--on-c-branca)}
.selo.azul{background:var(--c-azul);color:var(--on-c-azul)}
.selo.preta{background:var(--c-preta);color:var(--on-c-preta)}
.selo.vermelha{background:var(--c-vermelha);color:var(--on-c-vermelha)}
.origem{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 8px;border-radius:var(--r-full);font:500 12px/1 var(--font-body);white-space:nowrap}
.origem.oficial{background:var(--primary-container);color:var(--on-primary-container)}
.origem.comunidade{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.origem.pessoal{background:var(--sc-highest);color:var(--on-surface-variant)}
.origem.revisao{background:var(--error-container);color:var(--on-error-container)}
.exemplo{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:var(--r-xs);font:700 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--outline);color:var(--on-surface-variant)}
.tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:var(--r-xs);font:500 12px/1 var(--font-body);background:var(--sc-highest);color:var(--on-surface-variant)}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* superfícies */
.card{background:var(--sc-low);border:1px solid var(--outline-variant);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.link{text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.card.link:hover{background:var(--sc);border-color:var(--outline)}
.card.flat{border:0}
.list{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.atalhos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.atalho{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:12px;background:var(--sc-low);border:1px solid var(--outline-variant);color:var(--on-surface);text-decoration:none;font:500 14px/1.25 Roboto,system-ui,sans-serif}
.atalho:last-child:nth-child(odd){grid-column:1/-1}
.atalho>span:nth-child(2){flex:1;min-width:0}.atalho .selo{min-height:22px;padding:0 8px;font-size:12px}
.atalho .ms,.atalho .material-symbols-rounded{color:var(--primary)}
.atalho:hover{background:var(--sc)}
@media (min-width:840px){.atalhos{grid-template-columns:repeat(4,minmax(0,1fr))}.atalho:last-child:nth-child(odd){grid-column:auto}}
.row{display:flex;align-items:center;gap:16px;min-width:0}
.grow{flex:1;min-width:0}
.section{display:flex;flex-direction:column;gap:16px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--outline-variant);padding-top:16px}
.empty{border:1px dashed var(--outline);border-radius:var(--r-m);padding:20px;display:flex;flex-direction:column;gap:6px;background:var(--sc-low)}
.empty .h3{font-size:16px}
.divider{height:1px;background:var(--outline-variant);border:0;margin:0}

/* capa editorial */
.cover{display:grid;gap:20px;grid-template-columns:1fr;align-items:end}
@media (min-width:900px){.cover{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px}}
.cover-text{display:flex;flex-direction:column;gap:16px;min-width:0}
.foto{position:relative;border-radius:var(--r-l);border:1px solid var(--outline-variant);background:repeating-linear-gradient(135deg,var(--hatch) 0 10px,transparent 10px 20px),var(--sc);display:flex;align-items:flex-end;overflow:hidden;max-width:100%;color:var(--on-surface-variant)}
.foto .ms.cam{position:absolute;top:14px;right:14px;opacity:.7}
.foto figcaption{padding:14px 16px;font-size:12.5px;line-height:1.4;background:linear-gradient(transparent,color-mix(in srgb,var(--surface) 82%,transparent));width:100%}
.r45{aspect-ratio:4/5}
@media (max-width:899px){.cover .foto.r45,.nivel-hero .foto.r45,.colar-art .foto.r45{aspect-ratio:3/2}}
.no-icons .ms{visibility:hidden;width:0}.r169{aspect-ratio:16/9}.r32{aspect-ratio:3/2}.r11{aspect-ratio:1/1}.r219{aspect-ratio:21/9}
figure{margin:0}

/* nível */
.nivel-hero{border-radius:var(--r-xl);padding:clamp(20px,4vw,40px);display:grid;gap:24px;grid-template-columns:1fr;position:relative;overflow:hidden;border:1px solid var(--outline-variant)}
@media (min-width:900px){.nivel-hero{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:end}}

var $app = document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ic(n,cls){return '<span class="ms'+(cls?' '+cls:'')+'" aria-hidden="true">'+n+'</span>';}
function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function slug(s){return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function nivel(id){return NIVEIS.find(function(n){return n.id===id;});}
function nIdx(id){return NIVEIS.findIndex(function(n){return n.id===id;});}
function passo(id){return PASSOS.find(function(p){return p.id===id;});}
function exame(id){return EXAMES.find(function(e){return e.id===id;});}
function exameSaida(nid){return EXAMES.find(function(e){return e.de===nid;});}
function selo(nid,txt){var n=nivel(nid);return '<span class="selo '+n.cor+'">'+esc(txt||n.nome)+'</span>';}
var ORIG={oficial:'Oficial',comunidade:'Comunidade',pessoal:'Pessoal',revisao:'Em revisão'};
function origem(o){return '<span class="origem '+o+'">'+(o==='revisao'?ic('schedule','sm'):'')+ORIG[o]+'</span>';}
function exTag(){return '<span class="exemplo">Exemplo</span>';}
function foto(cap,r){return '<figure class="foto '+(r||'r45')+'">'+ic('photo_camera','cam')+'<figcaption>'+esc(cap)+'</figcaption></figure>';}
function two(n){return String(n).padStart(2,'0');}
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var DOW=['dom','seg','ter','qua','qui','sex','sáb'];
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function dataLonga(s){var d=pd(s);return DOW[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()];}
function dataCurta(s){if(!s)return '';var d=pd(s);return d.getDate()+' '+MES3[d.getMonth()]+' '+d.getFullYear();}
function hojeISO(){return iso(addDays(0));}
function isWide(){return window.matchMedia('(min-width:1200px)').matches;}
function podeEditar(){return S.perfil==='curador'||S.perfil==='colaborador';}
function passosDoNivel(nid,cat){return PASSOS.filter(function(p){return p.niveis.indexOf(nid)>=0&&(!cat||p.cat===cat)&&p.origem!=='revisao';});}
function combosComPasso(pid){return S.combos.filter(function(c){return c.passos.indexOf(pid)>=0;});}
function critKeys(e){var k=[];e.grupos.forEach(function(g,gi){g.itens.forEach(function(it,ii){k.push(e.id+':'+gi+':'+ii);});});return k;}
function progresso(nid){
  var ps=passosDoNivel(nid),ex=exameSaida(nid),ks=ex?critKeys(ex):[];
  var feitos=ps.filter(function(p){return S.status[p.id]==='revisado';}).length+ks.filter(function(k){return S.crit[k];}).length;
  var total=ps.length+ks.length;
  return {feitos:feitos,total:total,pct:total?Math.round(feitos/total*100):0,passos:ps.length,passosFeitos:ps.filter(function(p){return S.status[p.id]==='revisado';}).length,crit:ks.length,critFeitos:ks.filter(function(k){return S.crit[k];}).length};
}
function pendente(id){return S.pendRes[id]!=null?null:PEND.find(function(p){return p.id===id;});}
function pendValor(id){var p=PEND.find(function(x){return x.id===id;});return S.pendRes[id]!=null?p.ops[S.pendRes[id]]:null;}

function route(){

  var m=[
    ['nivel-',function(r){return {v:'nivel',id:r};}],
    ['passo-editar-',function(r){return {v:'passoForm',id:r};}],
    ['passo-',function(r){return r==='novo'?{v:'passoForm'}:{v:'passo',id:r};}],
    ['exame-',function(r){return {v:'exame',id:r};}],
    ['gerir-exame-',function(r){return {v:'gerirExame',id:r};}],
    ['combinacao-nova',function(){return {v:'comboForm'};}],
    ['combinacao-editar-',function(r){return {v:'comboForm',id:r};}],
    ['combinacao-',function(r){return {v:'combo',id:r};}],
    ['midia-',function(r){return {v:'midia',id:r};}],
    ['revisao-',function(r){return {v:'revisaoItem',id:r};}],
    ['evento-novo',function(){return {v:'eventoForm'};}],
    ['evento-',function(r){return {v:'evento',id:r};}]
  ];
  for(var i=0;i<m.length;i++){if(h.indexOf(m[i][0])===0)return m[i][1](h.slice(m[i][0].length));}
  return {v:h};
}
function sectionOf(r){
  var v=r.v;
  if(['inicio'].indexOf(v)>=0)return 'inicio';
  if(['trilha','nivel','sobre','evolucao'].indexOf(v)>=0)return v==='sobre'||v==='evolucao'?'mais':'trilha';
  if(['passos','passo','passoForm'].indexOf(v)>=0)return 'passos';
  if(['exames','exame','regras'].indexOf(v)>=0)return 'exames';
  return 'mais';
}

/* ---------- Biblioteca ---------- */
function filtrar(){
  var q=norm(S.ui.q),f=S.ui;
  return PASSOS.filter(function(p){
    if(p.origem==='revisao'&&S.perfil==='aluno')return false;
    if(q&&norm(p.nome).indexOf(q)<0)return false;
    if(f.fNivel.length&&!p.niveis.some(function(n){return f.fNivel.indexOf(n)>=0;}))return false;
    if(f.fCat.length&&f.fCat.indexOf(p.cat)<0)return false;
    if(f.fOrigem.length&&f.fOrigem.indexOf(p.origem)<0)return false;
    return true;
  });
}
function chip(a,v,label,on){return '<button class="chip" data-a="'+a+'" data-v="'+esc(v)+'" aria-pressed="'+on+'">'+(on?ic('check'):'')+esc(label)+'</button>';}
function bibliotecaList(selId){
  var f=S.ui,res=filtrar();
  if(S.falha)return erroBox('passos');
  if(!S.ui.loaded.passos)return skeletonList();
  return '<div class="search">'+ic('search')+'<label class="sr" for="busca">Buscar passo</label><input id="busca" data-in="q" placeholder="Buscar passo pelo nome" value="'+esc(f.q)+'" autocomplete="off">'+(f.q?'<button class="icon-btn" data-a="limparBusca" aria-label="Limpar busca">'+ic('close')+'</button>':'')+'</div>'+
  '<div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Nível</span><div class="chips">'+NIVEIS.map(function(n){return chip('fNivel',n.id,n.nome,f.fNivel.indexOf(n.id)>=0);}).join('')+'</div>'+
  '<span class="eyebrow">Categoria e origem</span><div class="chips">'+['Fechado','Aberto'].map(function(c){return chip('fCat',c,c,f.fCat.indexOf(c)>=0);}).join('')+['oficial','comunidade','pessoal'].map(function(o){return chip('fOrigem',o,ORIG[o],f.fOrigem.indexOf(o)>=0);}).join('')+'</div></div>'+
  '<div class="row"><span class="grow small muted" role="status">'+res.length+(res.length===1?' passo':' passos')+'</span>'+(f.fNivel.length||f.fCat.length||f.fOrigem.length||f.q?'<button class="btn text" data-a="limparFiltros">Limpar filtros</button>':'')+'</div>'+
  (res.length?'<div class="list">'+res.map(function(p){return passoCard(p,p.id===selId);}).join('')+'</div>':emptyBox('Nenhum passo encontrado','Tente outro nome ou remova algum filtro.','<div><button class="btn tonal" data-a="limparFiltros">Limpar filtros</button></div>'));
}

function passoDetalhe(p){
  var st=S.status[p.id]||'nao',combs=combosComPasso(p.id),mids=S.midias.filter(function(m){return m.passo===p.id;});
  var crits=[];EXAMES.forEach(function(e){e.grupos.forEach(function(g,gi){g.itens.forEach(function(it,ii){if(it.liga&&it.liga.indexOf(p.id)>=0)crits.push({e:e,g:g,key:e.id+':'+gi+':'+ii});});});});
  var acts='';
  if(S.perfil==='curador')acts='<div class="btn-row"><a class="btn outlined" href="#passo-editar-'+p.id+'"'+(S.offline?' aria-disabled="true" data-a="offlineBlock"':'')+'>'+ic('edit')+'Editar</a><button class="btn text" data-a="excluirPasso" data-v="'+p.id+'"'+needNet()+' style="color:var(--error)">'+ic('delete')+'Excluir</button></div>';
  else if(S.perfil==='colaborador')acts='<div class="btn-row"><a class="btn outlined" href="#passo-editar-'+p.id+'"'+(S.offline?' aria-disabled="true" data-a="offlineBlock"':'')+'>'+ic('edit')+'Sugerir edição</a></div>';
  return '<div class="section view-enter">'+
    '<div class="meta-row">'+p.niveis.map(function(x){return selo(x);}).join('')+origem(p.origem)+'<span class="tag">'+p.cat+'</span></div>'+
    '<h2 class="display" style="font-size:clamp(40px,7vw,72px)">'+esc(p.nome)+'</h2>'+acts+
    (p.origem==='revisao'?'<div class="banner warn">'+ic('schedule')+'<div class="small">Em revisão. Visível só para você e para o curador até a aprovação.</div></div>':'')+
    '<section class="section"><p class="eyebrow">Execução</p><p class="body-l measure" style="margin:0">'+esc(p.desc)+'</p><dl class="kv"><dt>Pisadas</dt><dd>'+(p.pisadas?esc(p.pisadas):'<span class="muted">A cadastrar</span>')+'</dd><dt>Categoria</dt><dd>'+p.cat+'</dd><dt>Níveis</dt><dd>'+p.niveis.map(function(x){return nivel(x).nome;}).join(', ')+'</dd></dl></section>'+
    '<section class="section"><div class="section-head"><h3 class="h3">Variações</h3></div>'+(p.variacoes.length?'<div class="list">'+p.variacoes.map(function(v){return '<div class="card flat"><p style="margin:0">'+esc(v.t)+'</p>'+(v.liga&&passo(v.liga)?'<a class="btn text" style="align-self:flex-start;padding:0" href="#passo-'+v.liga+'">Ver '+esc(passo(v.liga).nome)+ic('arrow_forward')+'</a>':'')+'</div>';}).join('')+'</div>':'<p class="muted" style="margin:0">A cadastrar</p>')+'</section>'+
    '<section class="section"><div class="section-head"><h3 class="h3">Meu estudo</h3><span class="small muted">Só você vê</span></div>'+
    '<div class="seg" role="group" aria-label="Status de estudo">'+[['nao','Não revisado'],['revisando','Revisando'],['revisado','Revisado']].map(function(o){return '<button data-a="status" data-id="'+p.id+'" data-v="'+o[0]+'" aria-pressed="'+(st===o[0])+'">'+(st===o[0]?ic('check'):'')+o[1]+'</button>';}).join('')+'</div>'+
    '<div class="field"><label for="nota-'+p.id+'">Minha observação</label><textarea class="textarea" id="nota-'+p.id+'" data-in="nota" data-v="'+p.id+'" placeholder="Escreva o que precisa praticar">'+esc(S.notas[p.id]||'')+'</textarea><span class="help">Separada da descrição oficial. Salva ao sair do campo.</span></div></section>'+
    '<section class="section"><div class="section-head"><h3 class="h3">Fotos e vídeos</h3>'+(podeEditar()?'<a class="btn text" href="#enviar-midia" data-a="midiaPara" data-v="'+p.id+'">'+ic('upload')+'Enviar</a>':'')+'</div>'+(mids.length?'<div class="grid2">'+mids.map(midiaCard).join('')+'</div>':emptyBox('Nenhum vídeo ainda','Envie um vídeo curto mostrando a execução. Antes de enviar, confirme que quem aparece concorda.'))+'</section>'+
    '<section class="section"><div class="section-head"><h3 class="h3">Critérios de exame relacionados</h3></div>'+(crits.length?'<div class="list">'+crits.map(function(c){return '<a class="card link" href="#exame-'+c.e.id+'"><span class="eyebrow">'+esc(nivel(c.e.de).nome)+' → '+esc(nivel(c.e.para).nome)+' · '+esc(c.g.nome)+'</span><span class="small">'+esc(c.g.itens[+c.key.split(':')[2]].t)+'</span></a>';}).join('')+'</div>':emptyBox('Nenhum critério ligado','O curador liga itens do manual a este passo quando há correspondência.'))+'</section>'+
    '<section class="section"><div class="section-head"><h3 class="h3">Combinações em que aparece</h3></div>'+(combs.length?'<div class="list">'+combs.map(comboCard).join('')+'</div>':emptyBox('Ainda não está em nenhuma combinação',null))+'</section>'+
  '</div>';
}
V.passo=function(r){
  var p=passo(r.id); if(!p)return notFound();
  S.ui.lastPasso=p.id;
  if(isWide()){
    ensureLoaded('passos');
    return topbar('Biblioteca de passos',null,themeBtn())+'<div class="page"><div class="ld"><div class="section">'+bibliotecaList(p.id)+'</div><div class="ld-detail">'+passoDetalhe(p)+'</div></div></div>';
  }
  return topbar(p.nome,'passos',themeBtn())+'<div class="page narrow">'+passoDetalhe(p)+'</div>';
};

/* ---------- Cadastrar / editar passo ---------- */
function fv(k){return S.ui.form&&S.ui.form[k]!=null?S.ui.form[k]:'';}
function field(id,label,ctrl,err,help){return '<div class="field'+(err?' err':'')+'"><label for="'+id+'">'+label+'</label>'+ctrl+(err?'<span class="help" role="alert">'+ic('error','sm')+' '+esc(err)+'</span>':help?'<span class="help">'+esc(help)+'</span>':'')+'</div>';}
V.passoForm=function(r){
  if(!podeEditar())return topbar('Cadastrar passo','passos')+'<div class="page narrow">'+emptyBox('Disponível para colaboradores e curadores','Mude o perfil de demonstração em Perfil para ver esta tela.','<div><a class="btn tonal" href="#perfil">Ir para Perfil</a></div>')+'</div>';
  var p=r.id?passo(r.id):null;
  var k='passo:'+(r.id||'novo');
  if(!S.ui.form||S.ui.form._k!==k){S.ui.form=p?{_k:k,nome:p.nome,niveis:p.niveis.slice(),cat:p.cat,desc:p.desc,pisadas:p.pisadas||'',vars:p.variacoes.map(function(v){return {t:v.t,liga:v.liga||''};})}:{_k:k,nome:'',niveis:[],cat:'',desc:'',pisadas:'',vars:[]};S.ui.errs={};}
  var f=S.ui.form,e=S.ui.errs;
  var dup=f.nome&&PASSOS.find(function(x){return norm(x.nome)===norm(f.nome)&&x.id!==(r.id||'');});
  var titulo=p?(S.perfil==='curador'?'Editar passo':'Sugerir edição'):'Cadastrar passo';
  return topbar(titulo,p?'passo-'+p.id:'passos')+'<div class="page narrow">'+
  (S.offline?'<div class="banner offline">'+ic('cloud_off')+'<div class="small">Cadastrar e editar precisam de internet. Volte a ficar online para salvar.</div></div>':'')+
  '<div class="banner info">'+ic(S.perfil==='curador'?'verified':'schedule')+'<div class="small">'+(S.perfil==='curador'?'Como curador, o passo é publicado como Oficial ao salvar.':'Como colaborador, o envio fica “Em revisão” até o curador aprovar.')+'</div></div>'+
  '<form class="form" data-f="passo" data-id="'+(r.id||'')+'" novalidate>'+
  field('f-nome','Nome do passo *','<input class="input" id="f-nome" data-in="form" data-k="nome" value="'+esc(f.nome)+'">',e.nome)+
  (dup?'<div class="banner pend">'+ic('content_copy')+'<div class="grow small">Já existe um passo chamado <b>'+esc(dup.nome)+'</b>. Confira antes de criar outro.<br><a href="#passo-'+dup.id+'" style="color:var(--primary)">Abrir '+esc(dup.nome)+'</a></div></div>':'')+
  '<div class="field'+(e.niveis?' err':'')+'"><span class="lbl">Níveis *</span><div class="chips">'+NIVEIS.map(function(n){return chip('fFormNivel',n.id,n.nome,f.niveis.indexOf(n.id)>=0);}).join('')+'</div>'+(e.niveis?'<span class="help" role="alert">'+esc(e.niveis)+'</span>':'<span class="help">O mesmo passo pode estar em mais de um nível, sem duplicar o cadastro.</span>')+'</div>'+
  '<div class="field'+(e.cat?' err':'')+'"><span class="lbl">Categoria *</span><div class="seg" role="group" aria-label="Categoria">'+['Fechado','Aberto'].map(function(c){return '<button type="button" data-a="fFormCat" data-v="'+c+'" aria-pressed="'+(f.cat===c)+'">'+(f.cat===c?ic('check'):'')+c+'</button>';}).join('')+'</div>'+(e.cat?'<span class="help" role="alert">'+esc(e.cat)+'</span>':'<span class="help">Novas categorias são criadas pelo curador em Gerir conteúdo.</span>')+'</div>'+
  field('f-desc','Descrição da execução','<textarea class="textarea" id="f-desc" data-in="form" data-k="desc">'+esc(f.desc)+'</textarea>')+
  field('f-pis','Quantidade de pisadas','<input class="input" id="f-pis" data-in="form" data-k="pisadas" value="'+esc(f.pisadas)+'" placeholder="Ex.: 3 + 3">',null,'Texto livre. Deixe em branco se não se aplica.')+
  '<div class="field"><span class="lbl">Variações</span><div class="list">'+f.vars.map(function(v,i){return '<div class="card flat"><div class="field"><label for="v-'+i+'">Variação '+(i+1)+'</label><input class="input" id="v-'+i+'" data-in="var" data-i="'+i+'" value="'+esc(v.t)+'"></div><div class="row"><div class="field grow"><label for="vl-'+i+'">Leva a outro passo (opcional)</label><select class="select" id="vl-'+i+'" data-in="varLiga" data-i="'+i+'"><option value="">Nenhum</option>'+PASSOS.map(function(x){return '<option value="'+x.id+'"'+(v.liga===x.id?' selected':'')+'>'+esc(x.nome)+'</option>';}).join('')+'</select></div><button type="button" class="icon-btn" data-a="rmVar" data-i="'+i+'" aria-label="Remover variação">'+ic('delete')+'</button></div></div>';}).join('')+'</div><div><button type="button" class="btn outlined" data-a="addVar">'+ic('add')+'Adicionar variação</button></div></div>'+
  '<div class="btn-row"><button class="btn filled lg" type="submit"'+needNet()+'>'+(S.perfil==='curador'?'Salvar passo':'Enviar para revisão')+'</button><button type="button" class="btn text" data-a="voltar" data-v="'+(p?'passo-'+p.id:'passos')+'">Cancelar</button></div>'+
  '</form></div>';
};

/* ---------- Exames ---------- */
V.exames=function(r,selId){
  var prox=S.nivel?exameSaida(S.nivel):null;
  var selE=selId?exame(selId):prox;
  var list=function(sel){return '<div class="list">'+EXAMES.map(function(e,i){var ks=critKeys(e),f=ks.filter(function(k){return S.crit[k];}).length;return '<a class="card link'+(sel===e.id?' sel':'')+'" href="#exame-'+e.id+'"'+(prox&&prox.id===e.id?' style="border-color:var(--primary);border-width:2px"':'')+'><div class="row"><span class="num muted">'+two(i+1)+'</span><span class="grow meta-row">'+selo(e.de)+ic('arrow_forward','sm')+selo(e.para)+'</span>'+(prox&&prox.id===e.id?'<span class="pill">Seu próximo</span>':'')+'</div><span class="small muted">'+e.grupos.map(function(g){return g.nome.replace('Etapa 2 · ','').replace('Etapa 1 · ','');}).join(' · ')+'</span>'+(f?'<span class="small">'+f+' de '+ks.length+' revisados</span>':'')+'</a>';}).join('')+'</div>';};
  var head='<section class="cover"><div class="cover-text"><p class="eyebrow">Exames de colar</p><h2 class="h1">Sete exames. Critérios do manual, sem atalhos.</h2><p class="muted measure" style="margin:0">Exames registrados na plataforma danca.com. O checklist mostra só o seu estudo, não aprovação.</p></div></section>';
  var regras='<a class="card link" href="#regras" style="background:var(--tertiary-container);color:var(--on-tertiary-container);border-color:transparent"><div class="row">'+ic('gavel')+'<span class="grow"><span class="h3">Regras gerais do exame</span><br><span class="small">Quem pode prestar, quando acontece, ficha de avaliação e conselho de classe</span></span>'+ic('chevron_right')+'</div></a>';
  return topbar('Exames',null,themeBtn())+'<div class="page">'+head+(isWide()?'<div class="ld"><div class="section">'+regras+list(selE&&selE.id)+'</div><div class="ld-detail">'+(selE?exameDetalhe(selE):emptyBox('Escolha um exame',null))+'</div></div>':regras+list())+'</div>';
};
function exameDetalhe(e){
  var ks=critKeys(e),f=ks.filter(function(k){return S.crit[k];}).length;
  var idx=EXAMES.indexOf(e);
  return '<div class="section view-enter">'+
  '<div class="meta-row">'+selo(e.de)+ic('arrow_forward')+selo(e.para)+'</div>'+
  '<h2 class="h1">'+esc(nivel(e.de).nome)+' → '+esc(nivel(e.para).nome)+'</h2>'+
  '<p class="small muted" style="margin:0">Exame '+two(idx+1)+' de 07 · Fonte: '+FONTE+'. O manual não classifica os itens em requisito ou recomendação, exceto onde indicado.</p>'+
  (e.nota?'<div class="banner pend">'+ic('report')+'<div class="small">'+esc(e.nota)+'</div></div>':'')+
  e.avisos.map(function(a){return '<div class="banner info">'+ic('info')+'<div class="small">'+esc(a)+'</div></div>';}).join('')+
  '<div class="row"><div class="grow"><div class="progress" style="color:var(--primary)"><i style="width:'+(ks.length?f/ks.length*100:0)+'%"></i></div></div><span class="small"><b>'+f+'</b> de '+ks.length+' revisados</span></div>'+
  e.grupos.map(function(g,gi){return '<section class="crit-group"><h3 class="h3">'+esc(g.nome)+'</h3>'+(g.desc?'<p class="small muted" style="margin:0 0 6px">'+esc(g.desc)+'</p>':'')+g.itens.map(function(it,ii){var key=e.id+':'+gi+':'+ii;return '<div class="crit-item"><span class="n">'+(ii+1)+'</span><div style="display:flex;flex-direction:column;gap:8px"><p>'+esc(it.t)+'</p>'+(it.tipo?'<div class="meta-row"><span class="tag" style="background:var(--tertiary-container);color:var(--on-tertiary-container)">'+it.tipo+'</span><span class="small muted">'+esc(it.obs||'')+'</span></div>':'')+(it.liga?'<div class="chips">'+it.liga.map(function(pid){return '<a class="chip" href="#passo-'+pid+'">'+esc(passo(pid).nome)+ic('chevron_right')+'</a>';}).join('')+'</div><span class="small muted">Passos ligados pelo curador</span>':'')+'<label class="check"><input type="checkbox" data-a="crit" data-v="'+key+'"'+(S.crit[key]?' checked':'')+'><span>Revisei</span></label></div></div>';}).join('')+'</section>';}).join('')+
  '<p class="small muted" style="margin:0">O checklist mostra só o seu progresso de estudo. Ele não indica aprovação nem aptidão para o exame.</p>'+
  (S.perfil==='curador'?'<div><a class="btn outlined" href="#gerir-exame-'+e.id+'">'+ic('edit')+'Editar critérios</a></div>':'')+
  '</div>';
}
V.exame=function(r){
  var e=exame(r.id);if(!e)return notFound();
  if(isWide())return V.exames(r,e.id);
  return topbar(nivel(e.de).nome+' → '+nivel(e.para).nome,'exames',themeBtn())+'<div class="page narrow">'+exameDetalhe(e)+'</div>';
};
V.regras=function(){
  function pendBlock(id){var p=PEND.find(function(x){return x.id===id;}),val=pendValor(id);
    if(val)return '<p style="margin:0">'+esc(val)+'</p><span class="small muted">Confirmado pelo curador</span>';
    return '<div class="banner pend">'+ic('hourglass_top')+'<div class="grow"><p class="title" style="margin:0">Aguardando confirmação do curador</p><details style="margin-top:6px"><summary class="small" style="cursor:pointer">O manual traz '+p.ops.length+' versões</summary><ol class="small" style="margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px">'+p.ops.map(function(o){return '<li>'+esc(o)+'</li>';}).join('')+'</ol></details>'+(S.perfil==='curador'?'<a class="btn text" style="padding:0;margin-top:6px" href="#gerir">Resolver em Gerir conteúdo</a>':'')+'</div></div>';}
  var bloco=function(t,body){return '<section class="crit-group"><h3 class="h3">'+t+'</h3><div style="display:flex;flex-direction:column;gap:10px;padding-top:6px">'+body+'</div></section>';};
  return topbar('Regras do exame','exames',themeBtn())+'<div class="page narrow">'+
  '<section class="section"><p class="eyebrow">Fonte: '+FONTE+'</p><h2 class="h1">Como funciona o exame de colar</h2></section>'+
  bloco('Quem pode prestar','<p style="margin:0">Alunos matriculados (em unidades da escola ou parceiras), com pelo menos 4 presenças no mês anterior ao do exame e que tenham cumprido o tempo mínimo da roda.</p><p class="eyebrow">Tempo mínimo da roda</p>'+pendBlock('tempo')+'<p style="margin:0">O exame é pago e a inscrição precisa ser adquirida pelo aluno sempre no prazo estabelecido pela escola.</p>')+
  bloco('Frequência e casos específicos','<p class="eyebrow">Gympass e TotalPass</p>'+pendBlock('gympass')+'<p class="eyebrow">Alunos estrangeiros</p>'+pendBlock('estrangeiros'))+
  bloco('Quando acontece','<dl class="kv"><dt>Belo Horizonte</dt><dd>Exame unificado em todas as unidades, a cada 3 meses.</dd><dt>Preta Av. → Vermelha</dt><dd>A cada 6 meses.</dd><dt>Transparente → Branca</dt><dd>A cada 45 dias, em cada unidade.</dd><dt>Outras cidades</dt><dd>Juiz de Fora, Rio/Niterói, SP, Florianópolis, Londres e São Petersburgo: a cada 3 ou 6 meses.</dd></dl>')+
  bloco('Segunda chamada',pendBlock('segunda'))+
  bloco('Cadastro no sistema','<p style="margin:0">Todos os exames são registrados na plataforma danca.com.</p><p class="small muted" style="margin:0">Endereço: danca.com</p>')+
  bloco('Conselho de classe','<p style="margin:0">Realizado pelas equipes de todas as unidades; os examinadores podem consultar, se necessário. Nele consta:</p><div class="chips"><span class="tag">Evolução do aluno nas aulas</span><span class="tag">Dificuldades e facilidades</span><span class="tag">Presença e dedicação</span></div>')+
  bloco('Campos da ficha de avaliação','<dl class="kv"><dt><b>Elogio</b></dt><dd>Sobre recurso acima do esperado pelo cobrado na roda.</dd><dt><b>Atenção ao recurso</b></dt><dd>Precisa ser treinado pois, apesar de não eliminatório, apresentou ressalvas.</dd><dt><b>Recurso com ressalvas</b></dt><dd>Ressalvas mais graves e principais responsáveis por uma possível reprovação.</dd><dt><b>Observação</b></dt><dd>Caso precise de um recurso que não está presente na ficha ou para destrinchar algo.</dd></dl><p class="small muted" style="margin:0">A ficha não precisa explicar como melhorar: isso é trabalhado em aula, ou o aluno procura o professor ou examinador depois.</p>')+
  bloco('Nivelamento','<p class="eyebrow">Ausência que exige nivelamento</p>'+pendBlock('esporadico')+'<p class="eyebrow">Período de teste</p>'+pendBlock('teste'))+
  '</div>';
};

/* ---------- Gerir conteúdo (curador) ---------- */

  return topbar('Gerir conteúdo','mais',themeBtn())+'<div class="page">'+
  '<section class="cover"><div class="cover-text"><p class="eyebrow">Curadoria</p><h2 class="h1">Níveis, critérios e o que falta confirmar.</h2></div></section>'+
  '<section class="section"><div class="section-head"><h2 class="h2">Divergências do manual · '+abertas.length+'</h2><span class="small muted">Até confirmar, o app mostra “Aguardando confirmação”</span></div>'+
  (abertas.length?'<div class="list">'+abertas.map(function(p){return '<div class="card"><p class="h3">'+esc(p.titulo)+'</p><fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px"><legend class="small muted" style="padding:0 0 4px">Qual versão vale?</legend>'+p.ops.map(function(o,i){return '<label class="check"><input type="radio" name="pend-'+p.id+'" data-a="pendPick" data-id="'+p.id+'" data-v="'+i+'"'+(S.ui['pp-'+p.id]==i?' checked':'')+'><span class="small">'+esc(o)+'</span></label>';}).join('')+'</fieldset><div><button class="btn tonal" data-a="pendOk" data-v="'+p.id+'"'+needNet()+'>Confirmar versão</button></div></div>';}).join('')+'</div>':emptyBox('Tudo confirmado','As regras do exame já mostram os valores escolhidos.'))+'</section>'+
  '<section class="section"><div class="section-head"><h2 class="h2">Níveis</h2><button class="btn text" data-a="novoNivel"'+needNet()+'>'+ic('add')+'Novo nível</button></div><div class="list">'+NIVEIS.map(function(n,i){var c=passosDoNivel(n.id).length;return '<div class="list-row"><span class="num muted" style="width:28px">'+two(i+1)+'</span>'+selo(n.id)+'<span class="grow small muted">'+(c?c+' passos':'Conteúdo a cadastrar')+'</span><a class="btn text" href="#nivel-'+n.id+'">Abrir</a></div>';}).join('')+'</div></section>'+
  '<section class="section"><div class="section-head"><h2 class="h2">Critérios dos exames</h2></div><div class="list">'+EXAMES.map(function(e){var v=(S.versoes[e.id]||[]).length+1;return '<a class="list-row" href="#gerir-exame-'+e.id+'"><span class="grow meta-row">'+selo(e.de)+ic('arrow_forward','sm')+selo(e.para)+'</span><span class="small muted">Versão '+v+'</span>'+ic('chevron_right')+'</a>';}).join('')+'</div></section>'+
  '</div>';
};
V.gerirExame=function(r){
  if(S.perfil!=='curador')return restrito('Editar critérios');
  var e=exame(r.id);if(!e)return notFound();
  var hist=[{v:1,quando:'Carga inicial',por:FONTE}].concat((S.versoes[e.id]||[]).map(function(x,i){return {v:i+2,quando:x.quando,por:x.item};})).reverse();

function render(scrollTop){

  var key=r.v+(r.id||'');

  lastView=key;

  rev:function(d){var f=S.fila.find(function(x){return x.id===d.id;}),com=document.getElementById('rev-com');
    if(d.v==='ajuste'&&com&&!com.value.trim()){com.focus();snack('Escreva um comentário para pedir ajuste.');return;}
    f.estado=d.v;snack({aprovado:'Aprovado. O envio aparece para todos com o selo Comunidade.',ajuste:'Ajuste pedido. O autor vê seu comentário.',recusado:'Envio recusado. O autor foi avisado.'}[d.v]);
    var next=S.fila.find(function(x){return x.estado==='pendente';});go(next?'revisao-'+next.id:'revisao');},
  agView:function(d){S.ui.agenda=d.v;},
  agTipo:function(d){S.ui.agTipo=d.v;},
  calMes:function(d){var b=S.ui.calMes?pd(S.ui.calMes):addDays(0);b=new Date(b.getFullYear(),b.getMonth()+(+d.v),1);S.ui.calMes=iso(b);},
  calDia:function(d){S.ui.calDia=d.v;},
  evTipo:function(d){S.ui.form.tipo=d.v;},
  excluirEvento:function(d){S.ui.dialog={icon:'delete',title:'Excluir evento?',body:'<p style="margin:0">O evento sai da agenda.</p>',actions:[{label:'Cancelar',a:'closeDialog'},{label:'Excluir',a:'confirmaExcluirEvento',v:d.v,kind:'danger'}]};},
  confirmaExcluirEvento:function(d){S.eventos=S.eventos.filter(function(e){return e.id!==d.v;});S.ui.dialog=null;go('agenda');snack('Evento excluído.');},
  pendPick:function(d){S.ui['pp-'+d.id]=d.v;},
  pendOk:function(d){var v=S.ui['pp-'+d.v];if(v==null){snack('Escolha uma das versões antes de confirmar.');return;}S.pendRes[d.v]=+v;snack('Versão confirmada. As regras do exame já mostram o valor.');},
  novoNivel:function(){snack('No app real, abre o cadastro de nível com nome, cor, ordem e significado.');},
  salvarItem:function(d){var e=exame(d.id),g=e.grupos[+d.g],it=g.itens[+d.i],el=document.getElementById('ed-'+d.g+'-'+d.i);if(!el||el.value.trim()===it.t)return snack('Nada mudou neste item.');it.t=el.value.trim();(S.versoes[e.id]=S.versoes[e.id]||[]).push({quando:'Hoje, '+new Date().toTimeString().slice(0,5),item:g.nome+', item '+(+d.i+1)+' editado pelo curador'});snack('Item salvo. A versão anterior ficou no histórico.');}
};
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el)return;
  var a=el.getAttribute('data-a');if(!A[a])return;
  if(el.tagName==='INPUT')return;
  if(el.disabled)return;
  var d=Object.assign({},el.dataset);
  if(a==='closeDialog'&&el.hasAttribute('href')){S.ui.dialog=null;return;}
  if(a!=='closeDialog'||!d.self)ev.preventDefault();
  if(a==='closeDialog'&&d.self){if(ev.target!==el)return;}
  if(el.getAttribute('href')&&a==='midiaPara'){A[a](d,ev);location.hash=el.getAttribute('href').slice(1);return;}
  A[a](d,ev);render(false);
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.matches('input[type=checkbox][data-a="crit"]')){A.crit(el.dataset,ev);var k=el.dataset.v;render(false);if(el.checked){var n=document.querySelector('[data-v="'+k+'"]');if(n&&n.parentElement)n.parentElement.classList.add('pop');}return;}
  if(el.matches('input[type=radio][data-a="pendPick"]')){A.pendPick(el.dataset);return;}
  var t=el.getAttribute('data-in');if(!t)return;
  if(t==='nota'){S.notas[el.dataset.v]=el.value;snack('Observação salva.');render(false);}
  else if(t==='notaNivel'){S.notaNivel[el.dataset.v]=el.value;snack('Observação salva.');render(false);}
  else if(t==='arquivo'){S.ui.form.arquivo=el.files&&el.files[0]?el.files[0].name:'';render(false);}
  else if(t==='consent'){S.ui.form.consent=el.checked;}
  else if(t==='varLiga'){S.ui.form.vars[+el.dataset.i].liga=el.value;}
  else if(t==='form'&&el.tagName==='SELECT'){S.ui.form[el.dataset.k]=el.value;render(false);}
});
document.addEventListener('input',function(ev){
  var el=ev.target,t=el.getAttribute('data-in');if(!t)return;
  if(t==='q'){S.ui.q=el.value;render(false);}
  else if(t==='form'){S.ui.form[el.dataset.k]=el.value;if(el.dataset.k==='nome'||el.dataset.k==='pq')render(false);}
  else if(t==='var'){S.ui.form.vars[+el.dataset.i].t=el.value;}
  else if(t==='trans'){S.ui.form.trans[+el.dataset.i]=el.value;}
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  var fm=ev.target,k=fm.getAttribute('data-f'),f=S.ui.form||{},e={};
  if(k==='entrar'){var em=document.getElementById('email').value.trim(),se=document.getElementById('senha').value;S.ui.form={email:em};if(!/.+@.+\..+/.test(em))e.email='Informe um e-mail válido, como nome@exemplo.com.';if(!se)e.senha='Informe sua senha.';S.ui.errs=e;if(!Object.keys(e).length){S.logado=true;S.ui.form=null;location.hash='inicio';snack('Bem-vindo de volta.');}render(false);return;}
  if(k==='criar'){var nm=document.getElementById('nome').value.trim(),em2=document.getElementById('email').value.trim(),s2=document.getElementById('senha').value;S.ui.form={nome:nm,email:em2};if(!nm)e.nome='Informe seu nome.';if(!/.+@.+\..+/.test(em2))e.email='Informe um e-mail válido, como nome@exemplo.com.';if(s2.length<8)e.senha='A senha precisa ter ao menos 8 caracteres.';S.ui.errs=e;if(!Object.keys(e).length){S.perfil='aluno';S.ui.form=null;location.hash='escolher-nivel';}else render(false);return;}
  if(k==='passo'){
    if(!f.nome.trim())e.nome='Informe o nome do passo.';if(!f.niveis.length)e.niveis='Escolha ao menos um nível.';if(!f.cat)e.cat='Escolha a categoria.';
    S.ui.errs=e;if(Object.keys(e).length){render(false);var fe=document.querySelector('.field.err input,.field.err textarea,.field.err button');if(fe)fe.focus();return;}
    var id=fm.dataset.id,vars=f.vars.filter(function(v){return v.t.trim();}).map(function(v){return v.liga?{t:v.t.trim(),liga:v.liga}:{t:v.t.trim()};});
    var data={nome:f.nome.trim(),niveis:f.niveis.slice(),cat:f.cat,desc:f.desc.trim(),pisadas:f.pisadas.trim()||null,variacoes:vars};
    var target;
    if(S.perfil==='curador'){if(id){target=passo(id);Object.assign(target,data);}else{target=Object.assign({id:slug(f.nome)+'-'+Date.now().toString(36).slice(-3),origem:'oficial'},data);PASSOS.push(target);}snack(id?'Passo atualizado. Histórico: editado pelo curador hoje.':'Passo publicado como Oficial.');}
    else{target=Object.assign({id:slug(f.nome)+'-r'+Date.now().toString(36).slice(-3),origem:'revisao'},data);PASSOS.push(target);S.fila.unshift({id:'f'+Date.now(),tipo:'Passo',titulo:(id?'Edição de ':'')+data.nome,autor:'Você',data:hojeISO(),ref:target.id,estado:'pendente'});snack('Enviado para revisão. Visível só para você e o curador.');}
    S.ui.form=null;go('passo-'+target.id);return;
  }
  if(k==='combo'){
    if(!f.nome.trim())e.nome='Dê um nome à combinação.';if(f.passos.length<2)e.passos='A combinação precisa de ao menos 2 passos.';
    S.ui.errs=e;if(Object.keys(e).length){render(false);return;}
    var cid=fm.dataset.id,c;
    if(cid){c=S.combos.find(function(x){return x.id===cid;});Object.assign(c,{nome:f.nome.trim(),nivel:f.nivel,aula:f.aula,passos:f.passos.slice(),trans:f.trans.slice()});}
    else{c={id:'p'+Date.now(),nome:f.nome.trim(),nivel:f.nivel,aula:f.aula,passos:f.passos.slice(),trans:f.trans.slice(),origem:'pessoal',exemplo:false,criado:hojeISO()};S.combos.push(c);}
    S.ui.form=null;go('combinacao-'+c.id);snack('Combinação salva na sua área pessoal.');return;
  }
  if(k==='midia'){
    if(!f.arquivo)e.arquivo='Escolha um arquivo de foto ou vídeo.';if(!f.titulo.trim())e.titulo='Informe um título.';if(!f.passo&&!f.nivel&&!f.combo)e.vinc='Ligue a mídia a um passo, nível ou combinação.';if(!f.consent)e.consent='Confirme o consentimento de quem aparece para enviar.';
    S.ui.errs=e;if(Object.keys(e).length){render(false);return;}
    var cur=S.perfil==='curador',m={id:'m'+Date.now(),tipo:/\.(jpe?g|png|gif|webp|heic)$/i.test(f.arquivo)?'Foto':'Vídeo',titulo:f.titulo.trim(),passo:f.passo,nivel:f.nivel||(f.passo?passo(f.passo).niveis[0]:''),combo:f.combo,desc:f.desc.trim(),origem:cur?'oficial':'revisao',exemplo:false,baixado:false,cap:'Arquivo enviado: '+f.arquivo};
    S.midias.push(m);if(!cur)S.fila.unshift({id:'f'+Date.now(),tipo:'Mídia',titulo:m.titulo,autor:'Você',data:hojeISO(),ref:f.passo,estado:'pendente'});
    S.ui.form=null;S.ui.midiaPara=null;go('midia-'+m.id);snack(cur?'Mídia publicada.':'Enviada para revisão.');return;
  }
  if(k==='evento'){
    if(!f.nome.trim())e.nome='Informe o nome do evento.';if(!f.data)e.data='Informe a data.';else if(f.data<hojeISO())e.data='A data já passou. Escolha uma data a partir de hoje.';if(!f.hora)e.hora='Informe o horário.';if(!f.local.trim())e.local='Informe o local.';if(!f.tipo)e.tipo='Escolha o tipo do evento.';
    S.ui.errs=e;if(Object.keys(e).length){render(false);return;}
    var ev2={id:'e'+Date.now(),nome:f.nome.trim(),data:f.data,hora:f.hora,local:f.local.trim(),cidade:'Belo Horizonte',tipo:f.tipo,desc:f.desc.trim(),link:f.link.trim(),obs:'',exemplo:false,pendente:S.perfil!=='curador'};
    S.eventos.push(ev2);if(ev2.pendente)S.fila.unshift({id:'f'+Date.now(),tipo:'Evento',titulo:ev2.nome,autor:'Você',data:hojeISO(),ref:'',estado:'pendente'});
    S.ui.form=null;go('evento-'+ev2.id);snack(ev2.pendente?'Evento enviado para revisão.':'Evento publicado na agenda.');return;
  }
  if(k==='mudarNivel'){var nv=document.getElementById('ev-nivel').value,dt=document.getElementById('ev-data').value;if(nv!==S.nivel){S.historico.push({nivel:nv,data:dt});S.nivel=nv;snack('Nível atualizado para '+nivel(nv).nome+'.');}else if(dt){S.historico[S.historico.length-1].data=dt;snack('Data registrada.');}render(false);return;}
});
